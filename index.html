<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" />
    <title>Hiremat Mess Davanagere - 100% Pure Veg Homestyle Meals & Tiffins</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">
    <script>
      try {
        localStorage.setItem('nl-hud:public:v1', 'hidden:9999999999999');
        localStorage.setItem('nl-hud:owner-private:v1', 'hidden');
      } catch(e) {}
      function killNetlifyBadge() {
        var frames = document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[title*="Netlify"], iframe[src*="netlify"]');
        for (var i = 0; i < frames.length; i++) {
          frames[i].remove();
        }
      }
      setInterval(killNetlifyBadge, 100);
      window.addEventListener('DOMContentLoaded', killNetlifyBadge);
      window.addEventListener('load', killNetlifyBadge);
      var netlifyKillObserver = new MutationObserver(killNetlifyBadge);
      netlifyKillObserver.observe(document.documentElement, { childList: true, subtree: true });
    </script>
    <style>
      #nl-badge-frame,
      #nl-hud-frame,
      #netlify-badge,
      .netlify-badge,
      [data-netlify-badge],
      iframe[title*="Netlify"],
      iframe[src*="netlify"],
      #netlify-drawer-container,
      netlify-drawer {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        clip-path: path("M0 0Z") !important;
        width: 0 !important;
        height: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        position: fixed !important;
        top: -99999px !important;
        left: -99999px !important;
        z-index: -99999 !important;
      }
    </style>
  </head>
  <body class="bg-[#fcfdf9] text-slate-900 antialiased selection:bg-emerald-200 selection:text-emerald-950">
    <div id="root">
      <!-- Instant App Launch Splash Screen (App Logo & Name) -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #ffffff 0%, #f4f9f1 100%); font-family: 'Outfit', sans-serif; text-align: center; padding: 24px;">
        <div style="width: 88px; height: 88px; border-radius: 26px; background: linear-gradient(135deg, #15803d, #064e3b); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px -6px rgba(21, 128, 61, 0.35); margin-bottom: 22px;">
          <svg width="44" height="44" viewBox="0 0 64 64" fill="none">
            <circle cx="50" cy="14" r="6" fill="#22c55e"/>
            <path d="M25 16v10a4 4 0 0 1-4 4v16a2.5 2.5 0 0 1-5 0V30a4 4 0 0 1-4-4V16" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 16v7" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M44 16c4 0 7 3.5 7 8 0 3.8-2.5 7-6 7.8V46a2.5 2.5 0 0 1-5 0V31.8c-3.5-.8-6-4-6-7.8 0-4.5 3-8 7-8z" fill="#ffffff"/>
          </svg>
        </div>
        <div style="display: inline-block; padding: 4px 14px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 9999px; color: #15803d; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;">
          🌿 100% Pure Veg • ಶುದ್ಧ ಸಸ್ಯಾಹಾರಿ
        </div>
        <h1 style="font-size: 28px; font-weight: 900; color: #0f172a; margin: 0 0 4px 0; letter-spacing: -0.02em;">
          Hiremat Mess
        </h1>
        <p style="font-size: 16px; font-weight: 700; color: #15803d; margin: 0 0 6px 0;">
          ಹಿರೇಮಠ್ ಮೆಸ್ • ದಾವಣಗೆರೆ
        </p>
        <p style="font-size: 13px; color: #64748b; margin: 0; max-width: 280px; line-height: 1.4;">
          Authentic Davanagere Homestyle Meals • BIET Road
        </p>
        <div style="margin-top: 24px; width: 48px; height: 3px; background: #e2e8f0; border-radius: 9999px; overflow: hidden;">
          <div style="width: 100%; height: 100%; background: #15803d; border-radius: 9999px;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
