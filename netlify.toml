[build]
  command = "pnpm run build"
  publish = "dist"

# Proxy all API requests to Render backend directly (solves any CORS or URL resolution issues)
[[redirects]]
  from = "/api/v1/*"
  to = "https://hiremata-mess.onrender.com/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://hiremata-mess.onrender.com/auth/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


